name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YANXING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $GITHUB_WORKSPACE/yanxing-release.p12
          echo "YANXING_KEYSTORE_FILE=$GITHUB_WORKSPACE/yanxing-release.p12" >> "$GITHUB_ENV"
          echo "YANXING_KEYSTORE_PASSWORD=${{ secrets.YANXING_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "YANXING_KEY_PASSWORD=${{ secrets.YANXING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "YANXING_KEY_ALIAS=${{ secrets.YANXING_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Run unit tests and assemble APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Verify APK signing certificate
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/35.0.0)
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "=== $apk ==="
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" \
              | grep -q 'CN=Yanxing Agent' \
              || { echo "签名证书不是固定签名，构建失败"; exit 1; }
          done

      - name: Upload Debug APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: yanxing-agent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: yanxing-agent-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
